steps:
  test:
    image: nimlang/nim:2.2.4-alpine
    commands:
      - apk add --no-cache gcc musl-dev openssl-dev pcre-dev git curl
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - nimble install --depsOnly -y
      - nimble test
    when:
      - event: push
      - event: pull_request
      - event: tag

  renovate:
    image: renovate/renovate:latest
    commands:
      - renovate "$CI_REPO"
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN:
        from_secret: renovate_token
    when:
      - event: cron
        cron: renovate
      - event: manual
